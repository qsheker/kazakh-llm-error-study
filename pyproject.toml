[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kazakh-llm-error-study"
version = "0.1.0"
description = "Reproducible four-model evaluation of Kazakh-language LLM responses"
requires-python = ">=3.11"
dependencies = [
  "fasttext-wheel==0.9.2",
  "huggingface-hub>=0.28,<2",
  "jsonschema>=4.20,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "python-docx>=1.1,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
