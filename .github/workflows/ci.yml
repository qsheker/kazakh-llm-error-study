name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run pytest
      - run: uv run python scripts/validate_protocol.py
      - run: uvx ruff==0.17.5 check scripts src tests
      - run: test ! -e data/blinding/private_model_key.csv
      - run: test -z "$(find . -type f -name '*.gguf' -print -quit)"
